type: custom:auto-entities
card:
  type: entities
  title: Zigbee Signal Strength (LQI)
  uix:
    style:
      template-entity-row $: |
        state-badge { background-color: transparent !important; }
        .flex { margin-left: 0px !important; }
      .: |
        template-entity-row { font-family: monospace; font-size: 90%; }
filter:
  template: >
    {# ======= CONFIGURATION ======= #}
    {% set nm = 'sensor.zigbee2mqtt_networkmap' %}
    {# ============================= #}

    {% set nodes = state_attr(nm, 'nodes') or [] %}

    {% set links = state_attr(nm, 'links') or [] %}

    {% set ns = namespace(rows=[]) %}

    {% for n in nodes | rejectattr('type','eq','Coordinator') |
    sort(case_sensitive=false, attribute='friendlyName') %}
      {% set ieee = n.ieeeAddr %}
      {% set p = links | selectattr('targetIeeeAddr','eq',ieee) | selectattr('relationship','eq',0) | first | default(none) %}
      {% set child = false %}
      {% if not p %}
        {% set p = links | selectattr('sourceIeeeAddr','eq',ieee) | selectattr('relationship','eq',1) | first | default(none) %}
        {% set child = true %}
      {% endif %}
      {% set down = p.lqi if p else none %}
      {% set up = none %}
      {% if p and not child %}
        {% set u = links | selectattr('sourceIeeeAddr','eq',ieee) | selectattr('targetIeeeAddr','eq',p.sourceIeeeAddr) | first | default(none) %}
        {% set up = u.lqi if u else none %}
      {% endif %}
      {% set pieee = (p.sourceIeeeAddr if p.targetIeeeAddr == ieee else p.targetIeeeAddr) if p else none %}
      {% set pn = nodes | selectattr('ieeeAddr','eq',pieee) | first | default(none) if pieee else none %}
      {% set parent = ('Coordinator' if pn.type == 'Coordinator' else pn.friendlyName) if pn else 'Not Found' %}
      {% set avg = (((down + up) / 2) if up is not none else -1) if (p and not child) else (down if down is not none else -1) %}
      {% set color = '#4CAF50' if avg >= 200 else '#FDD835' if avg >= 150 else '#FB8C00' if avg >= 100 else '#F44336' if avg >= 50 else '#5F5F5F' %}
      {% set icon = 'mdi:signal-cellular-3' if avg >= 200 else 'mdi:signal-cellular-2' if avg >= 150 else 'mdi:signal-cellular-1' if avg >= 100 else 'mdi:signal-cellular-outline' if avg >= 50 else 'mdi:signal-off' %}
      {% set d = down if down is not none else '--' %}
      {% set val = d if child else d ~ ' / ' ~ (up if up is not none else '--') %}
      {% set row = {
        'type': 'custom:template-entity-row',
        'active': true,
        'name': ('🔋 ' if n.type == 'EndDevice' else '🔌 ') ~ n.friendlyName,
        'state': val | string,
        'secondary': '⬆️ ' ~ parent,
        'icon': icon,
        'uix': {'style': ':host { --lqi-color: ' ~ color ~ '; }\nstate-badge { color: var(--lqi-color) !important; }\n'}
      } %}
      {% set ns.rows = ns.rows + [row] %}
    {% endfor %}

    {{ ns.rows }}